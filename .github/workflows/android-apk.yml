name: Android APK
on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Supabase migration SQL
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_sql_migrations.py\n          python scripts/validate_product_invariants.py
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle testDebugUnitTest assembleDebug
      - name: Audit APK for privileged Supabase credentials
        run: python scripts/audit_apk_secrets.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: you-are-my-soul-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
